<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center mb-6 border-b pb-4">
        <i class="fas fa-magnifying-glass text-3xl text-blue-600 mr-4"></i>
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Centro de Auditoría</h1>
            <p class="text-gray-500 mt-1">Herramienta para el análisis de actividad y seguridad.</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
        <form id="audit-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
            
            <div>
                <label for="audit-type" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Auditoría</label>
                <select id="audit-type" name="audit_type" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <optgroup label="Actividad General">
                        <option value="user_summary" data-requires="user">Resumen por Usuario</option>
                        <option value="top_users_data">Top 10 Usuarios (Datos)</option>
                    </optgroup>
                    <optgroup label="Seguridad y Políticas">
                        <option value="denied_access" data-requires="user_optional">Accesos Denegados (403)</option>
                        <option value="keyword_search" data-requires="user_optional,keyword">Búsqueda por Palabra Clave</option>
                        <option value="domain_access" data-requires="user_optional,domain">Acceso a Dominio Específico</option>
                        <option value="file_download_search" data-requires="user_optional">Búsqueda de Descargas (.exe, .zip)</option>
                    </optgroup>
                     <optgroup label="Auditoría Técnica">
                        <option value="ip_activity" data-requires="ip">Actividad por Dirección IP</option>
                        <option value="response_code_search" data-requires="user_optional,response_code">Análisis por Código de Respuesta</option>
                    </optgroup>
                </select>
            </div>

            <div id="conditional-inputs" class="contents">
                <div id="user-filter-container" class="conditional-input">
                    <label for="username-filter" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <select id="username-filter" name="username" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">-- Todos --</option>
                    </select>
                </div>
                <div id="keyword-input-container" class="conditional-input" style="display: none;">
                    <label for="keyword-input" class="block text-sm font-medium text-gray-700 mb-1">Palabra Clave</label>
                    <input type="text" id="keyword-input" name="keyword" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: juegos, descargas...">
                </div>
                <div id="domain-input-container" class="conditional-input" style="display: none;">
                    <label for="domain-input" class="block text-sm font-medium text-gray-700 mb-1">Dominio</label>
                    <input type="text" id="domain-input" name="domain" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: facebook.com">
                </div>
                 <div id="ip-input-container" class="conditional-input" style="display: none;">
                    <label for="ip-input" class="block text-sm font-medium text-gray-700 mb-1">Dirección IP</label>
                    <input type="text" id="ip-input" name="ip_address" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: 192.168.1.100">
                </div>
                <div id="response-code-input-container" class="conditional-input" style="display: none;">
                    <label for="response-code-input" class="block text-sm font-medium text-gray-700 mb-1">Código HTTP</label>
                    <input type="number" id="response-code-input" name="response_code" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: 404, 503">
                </div>
            </div>

            <div>
                <label for="start-date" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Inicio</label>
                <input type="date" id="start-date" name="start_date" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
                <label for="end-date" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Fin</label>
                <input type="date" id="end-date" name="end_date" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div class="lg:col-span-4 self-end">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 flex items-center justify-center">
                    <i class="fas fa-play mr-2"></i>
                    Generar Reporte
                </button>
            </div>
        </form>
    </div>

    <div id="audit-results-container" class="bg-white p-6 rounded-lg shadow-lg min-h-[300px]">
        <div class="text-center text-gray-500 py-10">
            <i class="fas fa-clipboard-list text-5xl mb-4 text-gray-300"></i>
            <h3 class="text-xl font-semibold">Seleccione los filtros y genere un reporte</h3>
            <p class="mt-2">Los resultados de su auditoría aparecerán aquí.</p>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('audit-form');
    const resultsContainer = document.getElementById('audit-results-container');
    const auditTypeSelect = document.getElementById('audit-type');
    const usernameSelect = document.getElementById('username-filter');
    const startDateInput = document.getElementById('start-date');
    const endDateInput = document.getElementById('end-date');

    const conditionalInputs = {
        user: document.getElementById('user-filter-container'),
        user_optional: document.getElementById('user-filter-container'),
        keyword: document.getElementById('keyword-input-container'),
        domain: document.getElementById('domain-input-container'),
        ip: document.getElementById('ip-input-container'),
        response_code: document.getElementById('response-code-input-container')
    };

    const today = new Date();
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(today.getDate() - 7);
    startDateInput.value = sevenDaysAgo.toISOString().split('T')[0];
    endDateInput.value = today.toISOString().split('T')[0];

    fetch('/api/all-users')
        .then(response => response.json())
        .then(users => {
            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                usernameSelect.appendChild(option);
            });
        });

    function toggleConditionalInputs() {
        Object.values(conditionalInputs).forEach(input => input.style.display = 'none');
        
        const selectedOption = auditTypeSelect.options[auditTypeSelect.selectedIndex];
        const required = selectedOption.dataset.requires?.split(',') || [];

        required.forEach(inputId => {
            if (conditionalInputs[inputId]) {
                conditionalInputs[inputId].style.display = 'block';
            }
        });

        const userOptional = required.includes('user_optional');
        conditionalInputs.user.querySelector('select option[value=""]').disabled = !userOptional;
        if (!userOptional) {
            conditionalInputs.user.querySelector('select').selectedIndex = 0;
        }
    }

    auditTypeSelect.addEventListener('change', toggleConditionalInputs);
    toggleConditionalInputs(); 

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        const selectedOption = auditTypeSelect.options[auditTypeSelect.selectedIndex];
        const requiredInputs = selectedOption.dataset.requires?.split(',') || [];
        
        if (requiredInputs.includes('user') && !data.username) {
            alert('Por favor, seleccione un usuario.');
            return;
        }
        if (requiredInputs.includes('keyword') && !data.keyword) {
            alert('Por favor, ingrese una palabra clave.');
            return;
        }

        resultsContainer.innerHTML = `
            <div class="text-center text-gray-500 py-10">
                <i class="fas fa-spinner fa-spin text-5xl mb-4 text-blue-500"></i>
                <h3 class="text-xl font-semibold">Generando reporte...</h3>
            </div>`;
        
        fetch('/api/run-audit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            renderResults(data.audit_type, result);
        })
        .catch(error => {
            resultsContainer.innerHTML = `<div class="text-center text-red-500 py-10"><strong>Error de red o del servidor:</strong> ${error}</div>`;
        });
    });

    function renderResults(auditType, data) {
        if (data.error) {
            resultsContainer.innerHTML = `<div class="text-center text-red-500 py-10"><strong>Error:</strong> ${data.error}</div>`;
            return;
        }
        
        let html = '';
        if (auditType === 'user_summary') {
            html = renderUserSummary(data);
        } else if (auditType === 'top_users_data') {
            html = renderTopUsers(data);
        } else if (['denied_access', 'keyword_search', 'domain_access', 'file_download_search', 'ip_activity', 'response_code_search'].includes(auditType)) {
            const titles = {
                denied_access: "Registros de Acceso Denegado (403)",
                keyword_search: "Resultados de Búsqueda por Palabra Clave",
                domain_access: "Resultados de Búsqueda por Dominio",
                file_download_search: "Resultados de Búsqueda de Descargas",
                ip_activity: "Resultados de Búsqueda por IP",
                response_code_search: "Resultados por Código de Respuesta"
            };
            html = renderGenericTable(titles[auditType], data.results);
        } else {
            html = '<p>Tipo de reporte no reconocido.</p>';
        }

        resultsContainer.innerHTML = html;

        const chartCanvas = document.getElementById('domain-chart');
        if (chartCanvas && data.top_domains) {
            renderDomainChart(chartCanvas, data.top_domains);
        }
    }

    // --- INICIO DE LA MODIFICACIÓN: Corrección del error de JavaScript ---
    function renderGenericTable(title, results) {
        if (!results || results.length === 0) {
            return `<h2 class="text-2xl font-bold mb-4">${title}</h2><p class="text-gray-500">No se encontraron registros para los filtros seleccionados.</p>`;
        }
        const rows = results.map(item => {
            // El backend envía la fecha como 'YYYYMMDD'. La formateamos en JavaScript.
            const dateStr = item.log_date; // ej: "20250703"
            // Se usa substring para extraer año, mes y día, y se unen con guiones.
            const formattedDate = `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
            
            return `
            <tr class="hover:bg-gray-50">
                <td class="p-2 text-sm">${formattedDate}</td>
                <td class="p-2 font-medium text-sm">${item.username}</td>
                <td class="p-2 text-sm">${item.ip}</td>
                <td class="p-2 text-sm text-gray-500 truncate" title="${item.url}">${item.url}</td>
                <td class="p-2 text-sm">${item.response}</td>
            </tr>`;
        }).join('');

        return `
            <h2 class="text-2xl font-bold mb-4">${title} (${results.length} registros)</h2>
            <div class="max-h-[600px] overflow-y-auto border rounded-lg">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 sticky top-0">
                        <tr>
                            <th class="p-2 text-xs font-bold uppercase">Fecha</th>
                            <th class="p-2 text-xs font-bold uppercase">Usuario</th>
                            <th class="p-2 text-xs font-bold uppercase">IP</th>
                            <th class="p-2 text-xs font-bold uppercase">URL</th>
                            <th class="p-2 text-xs font-bold uppercase">Código</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">${rows}</tbody>
                </table>
            </div>`;
    }
    // --- FIN DE LA MODIFICACIÓN ---
    
    function renderUserSummary(data) {
        const topDomainsHtml = data.top_domains.map(d => `<li>${d.domain} <span class="font-bold">(${d.count} reqs)</span></li>`).join('');
        return `
            <h2 class="text-2xl font-bold mb-4">Resumen de Actividad</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-blue-100 p-4 rounded-lg text-center"><div class="text-3xl font-bold">${data.total_requests.toLocaleString()}</div><div class="text-sm">Peticiones Totales</div></div>
                <div class="bg-green-100 p-4 rounded-lg text-center"><div class="text-3xl font-bold">${data.total_data_gb}</div><div class="text-sm">GB Consumidos</div></div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-xl font-semibold mb-2">Top 5 Dominios Visitados</h3>
                    <ul class="list-disc list-inside bg-gray-50 p-4 rounded">${topDomainsHtml}</ul>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-2">Gráfico de Visitas</h3>
                    <canvas id="domain-chart"></canvas>
                </div>
            </div>`;
    }

    function renderTopUsers(data) {
        const rows = data.top_users.map((user, index) => `
            <tr class="hover:bg-gray-50">
                <td class="p-3">${index + 1}</td>
                <td class="p-3 font-medium">${user.username}</td>
                <td class="p-3 font-mono">${user.total_data_gb.toFixed(2)} GB</td>
            </tr>`).join('');
        return `
            <h2 class="text-2xl font-bold mb-4">Top 10 Usuarios por Consumo de Datos</h2>
            <table class="w-full text-left">
                <thead class="bg-gray-100"><tr><th class="p-3">#</th><th class="p-3">Usuario</th><th class="p-3">Datos Consumidos</th></tr></thead>
                <tbody class="divide-y">${rows}</tbody>
            </table>`;
    }

    function renderDomainChart(canvas, domains) {
        new Chart(canvas, {
            type: 'doughnut',
            data: {
                labels: domains.map(d => d.domain),
                datasets: [{
                    label: 'Peticiones',
                    data: domains.map(d => d.count),
                    backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6'],
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'top' } } }
        });
    }
});
</script>
