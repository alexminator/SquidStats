<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div class="flex items-center mb-6 border-b pb-4">
        <i class="fas fa-magnifying-glass text-3xl text-blue-600 mr-4"></i>
        <div>
            <h1 class="text-3xl font-bold text-gray-800">Centro de Auditoría</h1>
            <p class="text-gray-500 mt-1">Herramienta para el análisis de actividad y seguridad.</p>
        </div>
    </div>

    <div class="bg-white p-6 rounded-lg shadow-lg mb-8">
        <form id="audit-form" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 items-end">
            
            <div>
                <label for="audit-type" class="block text-sm font-medium text-gray-700 mb-1">Tipo de Auditoría</label>
                <select id="audit-type" name="audit_type" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                    <optgroup label="Actividad General">
                        <option value="user_summary" data-requires="user">Resumen por Usuario</option>
                        <option value="top_users_data">Top 10 Usuarios (Datos)</option>
                    </optgroup>
                    <optgroup label="Seguridad y Políticas">
                        <option value="keyword_search" data-requires="user_optional,keyword">Búsqueda por Palabra Clave</option>
                        <option value="domain_access" data-requires="user_optional,domain">Acceso a Dominio Específico</option>
                        <option value="file_download_search" data-requires="user_optional">Búsqueda de Descargas (.exe, .zip)</option>
                    </optgroup>
                     <optgroup label="Auditoría Técnica">
                        <option value="ip_activity" data-requires="ip">Actividad por Dirección IP</option>
                        <option value="response_code_search" data-requires="user_optional,response_code">Análisis por Código de Respuesta</option>
                    </optgroup>
                </select>
            </div>

            <div id="conditional-inputs" class="contents">
                <div id="user-filter-container" class="conditional-input">
                    <label for="username-filter" class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
                    <select id="username-filter" name="username" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">-- Todos --</option>
                    </select>
                </div>
                <div id="keyword-input-container" class="conditional-input" style="display: none;">
                    <label for="keyword-input" class="block text-sm font-medium text-gray-700 mb-1">Palabra Clave</label>
                    <input type="text" id="keyword-input" name="keyword" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: juegos, descargas...">
                </div>
                <div id="domain-input-container" class="conditional-input" style="display: none;">
                    <label for="domain-input" class="block text-sm font-medium text-gray-700 mb-1">Dominio</label>
                    <input type="text" id="domain-input" name="domain" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: facebook.com">
                </div>
                 <div id="ip-input-container" class="conditional-input" style="display: none;">
                    <label for="ip-input" class="block text-sm font-medium text-gray-700 mb-1">Dirección IP</label>
                    <input type="text" id="ip-input" name="ip_address" class="w-full border-gray-300 rounded-md shadow-sm" placeholder="Ej: 192.168.1.100">
                </div>
                <div id="response-code-input-container" class="conditional-input" style="display: none;">
                    <label for="response-code-input" class="block text-sm font-medium text-gray-700 mb-1">Código HTTP</label>
                    <select id="response-code-input" name="response_code" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
                        <option value="">-- Seleccione un código --</option>
                        <optgroup label="Respuestas Exitosas (2xx)">
                            <option value="200">200 OK</option>
                        </optgroup>
                        <optgroup label="Redirecciones (3xx)">
                            <option value="301">301 Moved Permanently</option>
                            <option value="302">302 Found</option>
                            <option value="304">304 Not Modified</option>
                        </optgroup>
                        <optgroup label="Errores de Cliente (4xx)">
                            <option value="400">400 Bad Request</option>
                            <option value="401">401 Unauthorized</option>
                            <option value="403">403 Forbidden</option>
                            <option value="404">404 Not Found</option>
                        </optgroup>
                        <optgroup label="Errores de Servidor (5xx)">
                            <option value="500">500 Internal Server Error</option>
                            <option value="502">502 Bad Gateway</option>
                            <option value="503">503 Service Unavailable</option>
                            <option value="504">504 Gateway Timeout</option>
                        </optgroup>
                    </select>
                </div>
            </div>

            <div>
                <label for="start-date" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Inicio</label>
                <input type="date" id="start-date" name="start_date" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>
            <div>
                <label for="end-date" class="block text-sm font-medium text-gray-700 mb-1">Fecha de Fin</label>
                <input type="date" id="end-date" name="end_date" class="w-full border-gray-300 rounded-md shadow-sm focus:border-blue-500 focus:ring-blue-500">
            </div>

            <div class="lg:col-span-4 self-end">
                <button type="submit" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-all duration-300 flex items-center justify-center">
                    <i class="fas fa-play mr-2"></i>
                    Generar Reporte
                </button>
            </div>
        </form>
    </div>

    <div id="audit-results-container" class="space-y-4">
        <div class="bg-white p-6 rounded-lg shadow-lg min-h-[300px] flex items-center justify-center">
            <div class="text-center text-gray-500 py-10">
                <i class="fas fa-clipboard-list text-5xl mb-4 text-gray-300"></i>
                <h3 class="text-xl font-semibold">Seleccione los filtros y genere un reporte</h3>
                <p class="mt-2">Los resultados de su auditoría aparecerán aquí.</p>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleDetails(header) {
        const details = header.nextElementSibling;
        const icon = header.querySelector('.toggle-icon');
        
        if (details.style.display === 'block') {
            details.style.display = 'none';
            icon.classList.remove('rotate-180');
        } else {
            details.style.display = 'block';
            icon.classList.add('rotate-180');
        }
    }

document.addEventListener('DOMContentLoaded', function() {
    const form = document.getElementById('audit-form');
    const resultsContainer = document.getElementById('audit-results-container');
    const auditTypeSelect = document.getElementById('audit-type');
    const usernameSelect = document.getElementById('username-filter');
    const startDateInput = document.getElementById('start-date');
    const endDateInput = document.getElementById('end-date');
    
    const defaultResultsHTML = `<div class="bg-white p-6 rounded-lg shadow-lg min-h-[300px] flex items-center justify-center">
            <div class="text-center text-gray-500 py-10">
                <i class="fas fa-clipboard-list text-5xl mb-4 text-gray-300"></i>
                <h3 class="text-xl font-semibold">Seleccione los filtros y genere un reporte</h3>
                <p class="mt-2">Los resultados de su auditoría aparecerán aquí.</p>
            </div>
        </div>`;
    
    resultsContainer.innerHTML = defaultResultsHTML;

    const conditionalInputs = {
        user: document.getElementById('user-filter-container'),
        user_optional: document.getElementById('user-filter-container'),
        keyword: document.getElementById('keyword-input-container'),
        domain: document.getElementById('domain-input-container'),
        ip: document.getElementById('ip-input-container'),
        response_code: document.getElementById('response-code-input-container')
    };

    const today = new Date();
    const sevenDaysAgo = new Date();
    sevenDaysAgo.setDate(today.getDate() - 7);
    startDateInput.value = sevenDaysAgo.toISOString().split('T')[0];
    endDateInput.value = today.toISOString().split('T')[0];

    fetch('/api/all-users')
        .then(response => response.json())
        .then(users => {
            users.forEach(user => {
                const option = document.createElement('option');
                option.value = user;
                option.textContent = user;
                usernameSelect.appendChild(option);
            });
        });

    function toggleConditionalInputs() {
        resultsContainer.innerHTML = defaultResultsHTML;
        Object.values(conditionalInputs).forEach(input => input.style.display = 'none');
        
        const selectedOption = auditTypeSelect.options[auditTypeSelect.selectedIndex];
        const auditType = selectedOption.value;
        const required = selectedOption.dataset.requires?.split(',') || [];

        required.forEach(inputId => {
            if (conditionalInputs[inputId]) {
                conditionalInputs[inputId].style.display = 'block';
            }
        });
        
        const userSelectContainer = conditionalInputs.user;
        const defaultUserOption = userSelectContainer.querySelector('select option[value=""]');
        
        if (auditType === 'user_summary') {
            defaultUserOption.textContent = '--- Seleccione un usuario ---';
            defaultUserOption.disabled = true;
            usernameSelect.value = '';
        } else {
            defaultUserOption.textContent = '--- Todos ---';
            const isOptional = required.includes('user_optional');
            defaultUserOption.disabled = !isOptional;
        }
    }

    auditTypeSelect.addEventListener('change', toggleConditionalInputs);
    toggleConditionalInputs(); 

    form.addEventListener('submit', function(event) {
        event.preventDefault();
        
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());

        const selectedOption = auditTypeSelect.options[auditTypeSelect.selectedIndex];
        const requiredInputs = selectedOption.dataset.requires?.split(',') || [];
        
        if (requiredInputs.includes('user') && !data.username) {
            alert('Por favor, seleccione un usuario.'); return;
        }
        if (requiredInputs.includes('keyword') && !data.keyword) {
            alert('Por favor, ingrese una palabra clave.'); return;
        }
        if (requiredInputs.includes('ip') && !data.ip_address) {
            alert('Por favor, ingrese una dirección IP.'); return;
        }
        if (requiredInputs.includes('response_code') && !data.response_code) {
            alert('Por favor, ingrese un código de respuesta.'); return;
        }

        resultsContainer.innerHTML = `
            <div class="bg-white p-6 rounded-lg shadow-lg min-h-[300px] flex items-center justify-center">
                <div class="text-center text-gray-500 py-10">
                    <i class="fas fa-spinner fa-spin text-5xl mb-4 text-blue-500"></i>
                    <h3 class="text-xl font-semibold">Generando reporte...</h3>
                </div>
            </div>`;
        
        fetch('/api/run-audit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(result => {
            renderResults(data.audit_type, result);
        })
        .catch(error => {
            resultsContainer.innerHTML = `<div class="bg-white p-6 rounded-lg shadow-lg"><div class="text-center text-red-500 py-10"><strong>Error de red o del servidor:</strong> ${error}</div></div>`;
        });
    });

    function renderResults(auditType, data) {
        let html = '';
        if (data.error) {
            html = `<div class="bg-white p-6 rounded-lg shadow-lg"><div class="text-center text-red-500 py-10"><strong>Error:</strong> ${data.error}</div></div>`;
        } else {
            if (auditType === 'user_summary') {
                html = renderUserSummary(data);
            } else if (auditType === 'top_users_data') {
                html = renderTopUsers(data);
            } else if (auditType === 'keyword_search' || auditType === 'domain_access') {
                const title = auditType === 'keyword_search' ? "Resultados de Búsqueda por Palabra Clave" : "Resultados de Búsqueda por Dominio";
                html = renderGroupedKeywordTable(title, data.results);
            } else if (auditType === 'ip_activity') {
                const ip = document.getElementById('ip-input').value;
                html = renderIpActivityResults(data.results, ip);
            } else if (auditType === 'response_code_search') {
                const user = document.getElementById('username-filter').value || 'Todos';
                const code = document.getElementById('response-code-input').value;
                html = renderResponseCodeResults(data.results, user, code);
            } else if (['file_download_search'].includes(auditType)) {
                const titles = { file_download_search: "Resultados de Búsqueda de Descargas" };
                html = renderGenericTable(titles[auditType], data.results);
            } else {
                html = '<div class="bg-white p-6 rounded-lg shadow-lg"><p>Tipo de reporte no reconocido.</p></div>';
            }
        }

        resultsContainer.innerHTML = html;

        const domainChartCanvas = document.getElementById('domain-chart');
        if (domainChartCanvas && data.top_domains) {
            renderDomainChart(domainChartCanvas, data.top_domains);
        }

        const responseChartCanvas = document.getElementById('response-chart');
        if (responseChartCanvas && data.response_summary) {
            renderResponseChart(responseChartCanvas, data.response_summary);
        }
    }
    
    function formatBytes(bytes, decimals = 2) {
        if (!+bytes) return '0 Bytes';
        const k = 1024;
        const dm = decimals < 0 ? 0 : decimals;
        const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
    }

    function renderResponseCodeResults(results, forUser, forCode) {
        const title = `Resultados por Código de Respuesta ${forCode} para: ${forUser}`;
        if (!results || results.length === 0) {
            return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">${title}</h2><p class="text-gray-500">No se encontraron registros.</p></div>`;
        }
        
        const usersData = {};
        results.forEach(item => {
            if (!usersData[item.username]) usersData[item.username] = {};
            const dateStr = `${item.log_date.substring(0, 4)}-${item.log_date.substring(4, 6)}-${item.log_date.substring(6, 8)}`;
            if (!usersData[item.username][dateStr]) usersData[item.username][dateStr] = { daily_requests: 0, daily_data: 0, activities: [] };
            
            const dateGroup = usersData[item.username][dateStr];
            dateGroup.activities.push(item);
            dateGroup.daily_requests += Number(item.access_count) || 0;
            dateGroup.daily_data += Number(item.total_data) || 0;
        });

        let html = `<h2 class="text-2xl font-bold mb-4">${title}</h2>`;
        for (const username in usersData) {
            const userDataByDate = usersData[username];
            html += `<div class="border rounded-lg mb-3 shadow-md bg-white">
                        <div class="bg-gray-100 p-3 flex justify-between items-center cursor-pointer hover:bg-gray-200" onclick="toggleDetails(this)">
                            <h3 class="font-bold text-gray-800 flex items-center"><i class="fas fa-user mr-3 text-blue-600"></i>${username}</h3>
                            <i class="fas fa-chevron-down toggle-icon transition-transform"></i>
                        </div>
                        <div class="user-card-details border-t border-gray-200" style="display: none;">`;
            
            const sortedDates = Object.keys(userDataByDate).sort().reverse();
            for (const date of sortedDates) {
                const dateData = userDataByDate[date];
                html += `<div class="border-b last:border-b-0">
                            <div class="bg-blue-50 p-2 pl-6 flex justify-between items-center cursor-pointer hover:bg-blue-100" onclick="toggleDetails(this)">
                                <h4 class="font-semibold text-blue-800"><i class="fas fa-calendar-alt mr-2"></i>${date}</h4>
                                <div class="flex items-center space-x-4 text-sm">
                                    <span class="font-medium text-blue-700"><i class="fas fa-hashtag mr-1"></i>${dateData.daily_requests.toLocaleString()} Peticiones</span>
                                    <span class="font-medium text-green-700"><i class="fas fa-database mr-1"></i>${formatBytes(dateData.daily_data)}</span>
                                    <i class="fas fa-chevron-down toggle-icon transition-transform text-xs"></i>
                                </div>
                            </div>
                            <div class="date-details p-3" style="display: none;">
                                <table class="w-full text-left text-sm mt-2">
                                    <thead class="border-b-2 border-gray-300">
                                        <tr>
                                            <th class="py-1 px-2">URL</th>
                                            <th class="py-1 px-2 text-center">Peticiones</th>
                                            <th class="py-1 px-2">Datos</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">`;
                const ensureProtocol = (url) => url.startsWith('http') ? url : `http://${url}`;
                dateData.activities.forEach(activity => {
                    html += `<tr class="hover:bg-gray-50"><td class="py-1 px-2 truncate"><a href="${ensureProtocol(activity.url)}" target="_blank" class="text-blue-600 hover:underline" title="${activity.url}">${activity.url}</a></td><td class="py-1 px-2 text-center">${activity.access_count}</td><td class="py-1 px-2">${formatBytes(activity.total_data)}</td></tr>`;
                });
                html += `</tbody></table></div></div>`;
            }
            html += `</div></div>`;
        }
        return html;
    }

    function renderIpActivityResults(results, ip_address) {
        const title = `Resultados de Búsqueda para la IP: ${ip_address}`;
        if (!results || results.length === 0) {
            return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">${title}</h2><p class="text-gray-500">No se encontraron registros.</p></div>`;
        }
        
        const usersData = {};
        results.forEach(item => {
            if (!usersData[item.username]) {
                usersData[item.username] = {};
            }
            const dateStr = `${item.log_date.substring(0, 4)}-${item.log_date.substring(4, 6)}-${item.log_date.substring(6, 8)}`;
            if (!usersData[item.username][dateStr]) {
                usersData[item.username][dateStr] = { daily_requests: 0, daily_data: 0, activities: [] };
            }
            const dateGroup = usersData[item.username][dateStr];
            dateGroup.activities.push(item);
            
            dateGroup.daily_requests += Number(item.access_count) || 0;
            dateGroup.daily_data += Number(item.total_data) || 0;
        });

        let html = `<h2 class="text-2xl font-bold mb-4">${title}</h2>`;
        for (const username in usersData) {
            const userDataByDate = usersData[username];
            html += `
                <div class="border rounded-lg mb-3 shadow-md bg-white">
                    <div class="bg-gray-100 p-3 flex justify-between items-center cursor-pointer hover:bg-gray-200" onclick="toggleDetails(this)">
                        <h3 class="font-bold text-gray-800 flex items-center">
                            <i class="fas fa-user mr-3 text-blue-600"></i>${username}
                        </h3>
                        <i class="fas fa-chevron-down toggle-icon transition-transform"></i>
                    </div>
                    <div class="user-card-details border-t border-gray-200" style="display: none;">`;
            
            const sortedDates = Object.keys(userDataByDate).sort().reverse(); 

            for (const date of sortedDates) {
                const dateData = userDataByDate[date];
                html += `
                    <div class="border-b last:border-b-0">
                        <div class="bg-blue-50 p-2 pl-6 flex justify-between items-center cursor-pointer hover:bg-blue-100" onclick="toggleDetails(this)">
                            <h4 class="font-semibold text-blue-800"><i class="fas fa-calendar-alt mr-2"></i>${date}</h4>
                            <div class="flex items-center space-x-4 text-sm">
                                <span class="font-medium text-blue-700"><i class="fas fa-hashtag mr-1"></i>${dateData.daily_requests.toLocaleString()} Peticiones</span>
                                <span class="font-medium text-green-700"><i class="fas fa-database mr-1"></i>${formatBytes(dateData.daily_data)}</span>
                                <i class="fas fa-chevron-down toggle-icon transition-transform text-xs"></i>
                            </div>
                        </div>
                        <div class="date-details p-3" style="display: none;">
                            <table class="w-full text-left text-sm mt-2">
                                <thead class="border-b-2 border-gray-300">
                                    <tr>
                                        <th class="py-1 px-2">URL Visitada</th>
                                        <th class="py-1 px-2 text-center">Intentos</th>
                                        <th class="py-1 px-2">Datos</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-100">`;
                
                const ensureProtocol = (url) => url.startsWith('http') ? url : `http://${url}`;
                dateData.activities.forEach(activity => {
                    html += `<tr class="hover:bg-gray-50"><td class="py-1 px-2 truncate"><a href="${ensureProtocol(activity.url)}" target="_blank" class="text-blue-600 hover:underline" title="${activity.url}">${activity.url}</a></td><td class="py-1 px-2 text-center">${activity.access_count}</td><td class="py-1 px-2">${formatBytes(activity.total_data)}</td></tr>`;
                });
                html += '</tbody></table></div></div>';
            }
            html += `</div></div>`;
        }
        return html;
    }

    function renderGroupedKeywordTable(title, results) {
        if (!results || results.length === 0) {
            return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">${title}</h2><p class="text-gray-500">No se encontraron registros para los filtros seleccionados.</p></div>`;
        }
        const rows = results.map(item => {
            const dateStr = item.log_date;
            const formattedDate = `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
            
            return `
            <tr class="hover:bg-gray-50">
                <td class="p-2 text-sm">${formattedDate}</td>
                <td class="p-2 font-medium text-sm">${item.username}</td>
                <td class="p-2 text-sm">${item.ip}</td>
                <td class="p-2 text-sm text-gray-500 truncate" title="${item.url}">${item.url}</td>
                <td class="p-2 text-sm text-center font-bold">${item.access_count}</td>
            </tr>`;
        }).join('');

        return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">${title} (${results.length} registros únicos)</h2>
            <div class="max-h-[600px] overflow-y-auto border rounded-lg">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 sticky top-0">
                        <tr>
                            <th class="p-2 text-xs font-bold uppercase">Fecha</th>
                            <th class="p-2 text-xs font-bold uppercase">Usuario</th>
                            <th class="p-2 text-xs font-bold uppercase">IP</th>
                            <th class="p-2 text-xs font-bold uppercase">URL</th>
                            <th class="p-2 text-xs font-bold uppercase text-center">Intentos</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">${rows}</tbody>
                </table>
            </div></div>`;
    }

    function renderGenericTable(title, results) {
        if (!results || results.length === 0) {
            return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">${title}</h2><p class="text-gray-500">No se encontraron registros para los filtros seleccionados.</p></div>`;
        }
        const rows = results.map(item => {
            const dateStr = item.log_date;
            const formattedDate = `${dateStr.substring(0, 4)}-${dateStr.substring(4, 6)}-${dateStr.substring(6, 8)}`;
            
            return `
            <tr class="hover:bg-gray-50">
                <td class="p-2 text-sm">${formattedDate}</td>
                <td class="p-2 font-medium text-sm">${item.username}</td>
                <td class="p-2 text-sm">${item.ip}</td>
                <td class="p-2 text-sm text-gray-500 truncate" title="${item.url}">${item.url}</td>
                <td class="p-2 text-sm">${item.response}</td>
            </tr>`;
        }).join('');

        return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">${title} (${results.length} registros)</h2>
            <div class="max-h-[600px] overflow-y-auto border rounded-lg">
                <table class="w-full text-left">
                    <thead class="bg-gray-100 sticky top-0">
                        <tr>
                            <th class="p-2 text-xs font-bold uppercase">Fecha</th>
                            <th class="p-2 text-xs font-bold uppercase">Usuario</th>
                            <th class="p-2 text-xs font-bold uppercase">IP</th>
                            <th class="p-2 text-xs font-bold uppercase">URL</th>
                            <th class="p-2 text-xs font-bold uppercase">Código</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y">${rows}</tbody>
                </table>
            </div></div>`;
    }
    
    function renderUserSummary(data) {
        const topDomainsHtml = data.top_domains.map(d => `<li>${d.domain} <span class="font-bold">(${d.count} reqs)</span></li>`).join('');
        const responseSummaryHtml = data.response_summary.slice(0, 5).map(r => `<li>${r.code}: <span class="font-bold">${r.count.toLocaleString()}</span></li>`).join('');

        return `<div class="bg-white p-6 rounded-lg shadow-lg">
            <h2 class="text-2xl font-bold mb-4">Resumen de Actividad</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                <div class="bg-blue-100 p-4 rounded-lg text-center"><div class="text-3xl font-bold">${data.total_requests.toLocaleString()}</div><div class="text-sm">Peticiones Totales</div></div>
                <div class="bg-green-100 p-4 rounded-lg text-center"><div class="text-3xl font-bold">${data.total_data_gb}</div><div class="text-sm">GB Consumidos</div></div>
                <div class="bg-gray-100 p-4 rounded-lg">
                    <h4 class="font-semibold text-sm mb-1 text-center">Resumen de Respuestas</h4>
                    <ul class="text-xs space-y-1">${responseSummaryHtml}</ul>
                </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <h3 class="text-xl font-semibold mb-2">Top 5 Dominios Visitados</h3>
                    <canvas id="domain-chart"></canvas>
                </div>
                <div>
                    <h3 class="text-xl font-semibold mb-2">Distribución de Respuestas HTTP</h3>
                    <canvas id="response-chart"></canvas>
                </div>
            </div></div>`;
    }

    function renderTopUsers(data) {
        const rows = data.top_users.map((user, index) => `
            <tr class="hover:bg-gray-50">
                <td class="p-3">${index + 1}</td>
                <td class="p-3 font-medium">${user.username}</td>
                <td class="p-3 font-mono">${user.total_data_gb.toFixed(2)} GB</td>
            </tr>`).join('');
        return `<div class="bg-white p-6 rounded-lg shadow-lg"><h2 class="text-2xl font-bold mb-4">Top 10 Usuarios por Consumo de Datos</h2>
            <table class="w-full text-left">
                <thead class="bg-gray-100"><tr><th class="p-3">#</th><th class="p-3">Usuario</th><th class="p-3">Datos Consumidos</th></tr></thead>
                <tbody class="divide-y">${rows}</tbody>
            </table></div>`;
    }

    function renderDomainChart(canvas, domains) {
        new Chart(canvas, {
            type: 'pie',
            data: {
                labels: domains.map(d => d.domain),
                datasets: [{
                    label: 'Peticiones',
                    data: domains.map(d => d.count),
                    backgroundColor: ['#3B82F6', '#10B981', '#F59E0B', '#EF4444', '#8B5CF6'],
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'right' } } }
        });
    }

    function renderResponseChart(canvas, responses) {
        const getResponseColor = (code) => {
            if (code >= 500) return '#DC2626'; 
            if (code >= 400) return '#F59E0B'; 
            if (code >= 300) return '#3B82F6'; 
            if (code >= 200) return '#10B981'; 
            return '#6B7280'; 
        };

        new Chart(canvas, {
            type: 'pie',
            data: {
                labels: responses.map(r => `Código ${r.code}`),
                datasets: [{
                    label: 'Cantidad',
                    data: responses.map(r => r.count),
                    backgroundColor: responses.map(r => getResponseColor(r.code)),
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'right' } } }
        });
    }
});
</script>
